<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔불 · 이펙트 시험장</title>
<script>
// 시간 조절: 이펙트들이 쓰는 performance.now와 requestAnimationFrame의 시각을 느리게·멈추게 한다 (모듈보다 먼저 실행).
(()=>{const real=performance.now.bind(performance);let base=real(),vbase=base,scale=1;const vnow=()=>vbase+(real()-base)*scale;
 performance.now=vnow;const raf=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=cb=>raf(()=>cb(vnow()));
 const st=window.setTimeout.bind(window);window.setTimeout=(f,ms=0,...a)=>st(f,scale>0?ms/scale:ms,...a);
 window.__lab={setScale(s){vbase=vnow();base=real();scale=s;},step(ms){vbase+=ms;},get scale(){return scale;},now:vnow};})();
</script>
<style>
:root{color-scheme:dark;--ink:#efe6ff;--dim:#9c92b8;--line:#3a3150;--acc:#b77cff;font:14px/1.45 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0c0912;color:var(--ink);overflow:hidden}
#app{display:grid;grid-template-columns:290px 1fr;height:100%}
aside{border-right:1px solid var(--line);overflow:auto;padding:12px 12px 40px;background:#120e1b;position:relative;z-index:90}
h1{font-size:16px;margin:0 0 2px}h1+p{color:var(--dim);margin:0 0 10px;font-size:12px}
h2{font-size:12px;color:var(--dim);margin:14px 0 6px;letter-spacing:.04em}
.grid{display:flex;flex-wrap:wrap;gap:5px}
button,select{background:#1d1729;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:#3b2463;border-color:var(--acc)}
.fx{display:block;width:100%;text-align:left;margin:0 0 4px}.fx small{color:var(--dim);margin-left:4px}
details{border:1px solid var(--line);border-radius:9px;margin:0 0 6px;padding:4px 8px 6px;background:#16111f}details[open]{padding-bottom:8px}
summary{cursor:pointer;padding:3px 0;font-weight:600}summary img{width:22px;height:22px;border-radius:50%;vertical-align:-6px;margin-right:6px;object-fit:cover;object-position:top}
label.row{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:13px}input[type=range]{flex:1}
#stageWrap{position:relative;display:grid;place-items:center;background:#05040a}
#game{position:relative;width:min(100%,1277px);aspect-ratio:1277/635;overflow:hidden;background:#1a1428 center/cover no-repeat;border:1px solid #241c35}
#game.mobile{width:844px;aspect-ratio:844/390}
#game .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,14,.15),rgba(8,5,14,.55))}
.actor{position:absolute;bottom:18%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.actor img.sprite{display:block;height:calc(var(--h)*var(--scale));width:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.actor span{font-size:11px;color:#d9cff2;text-shadow:0 1px 3px #000;margin-top:2px}
.actor::after{content:'';position:absolute;bottom:14px;width:70%;height:12px;border-radius:50%;background:rgba(0,0,0,.35);z-index:-1}
#ally{left:28%;--h:200px}#enemy{left:66%;--h:150px}#enemy2{left:80%;--h:120px}
#hud{position:absolute;left:10px;top:8px;font-size:12px;color:#d9cff2;text-shadow:0 1px 3px #000;z-index:2}
#hud b{color:#fff}#scrub{display:none}#scrub.show{display:block}
.note{color:var(--dim);font-size:12px;margin:8px 0 0}
.cards{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:6px}
.cards i{display:block;width:calc(54px*var(--scale));height:calc(76px*var(--scale));border-radius:6px;background:linear-gradient(160deg,#3a2b57,#1c1430);border:1px solid #6b55a0}
</style></head>
<body>
<div id="app">
<aside>
 <h1>이펙트 시험장</h1><p>게임을 켜지 않고 이펙트만 골라 봅니다. 게임과 같은 코드로 그립니다.</p>
 <h2>재생</h2>
 <div class="grid" id="speeds"><button data-s="1" class="on">보통</button><button data-s=".5">½ 느리게</button><button data-s=".2">⅕ 느리게</button><button data-s="0">멈춤</button></div>
 <div class="grid" style="margin-top:5px"><button id="step">▶| 한 프레임</button><button id="again">↻ 다시</button><button id="loop">반복 끔</button></div>
 <label class="row"><input type="checkbox" id="short"> 짧은 연출 (게임 설정)</label>
 <label class="row"><input type="checkbox" id="calm"> 움직임 줄이기 (섬광 약하게)</label>
 <h2>배경</h2>
 <div class="grid" id="bgs"><button data-bg="assets/prologue/battle-1.webp" class="on">전장 1</button><button data-bg="assets/prologue/battle-2.webp">전장 2</button><button data-bg="assets/backgrounds/late-a.webp">저녁</button><button data-bg="#000">검정</button><button data-bg="#cfc8d8">밝은 회색</button></div>
 <h2>화면 크기</h2>
 <div class="grid" id="sizes"><button data-size="pc" class="on">PC</button><button data-size="mobile">모바일 가로</button></div>
 <div id="scrub"><h2>장면 고정 (심판)</h2><label class="row"><input type="range" id="T" min="0" max="1.7" step="0.01" value="0.52"><b id="Tv">0.52초</b></label><p class="note">슬라이더를 움직이면 그 순간 한 장면만 그립니다.</p></div>
 <h2>이펙트</h2>
 <div id="list"></div>
 <p class="note">전투 흐름(카드 사용·피해 숫자·결합)까지 보려면 <a href="qa.html" target="_top" style="color:var(--acc)">QA 화면</a>의 「게임」 탭을 쓰세요.</p>
</aside>
<div id="stageWrap">
 <div id="game" style="--scale:1">
  <div class="shade"></div>
  <div id="hud">이펙트를 고르세요</div>
  <div class="actor" id="ally"><img class="sprite" alt=""><span></span></div>
  <div class="actor" id="enemy"><img class="sprite" alt="" src="assets/enemies/abyss-grub.webp"><span>적</span></div>
  <div class="actor" id="enemy2"><img class="sprite" alt="" src="assets/enemies/abyss-worm.webp"><span>적 2</span></div>
  <div class="cards"><i></i><i></i><i></i></div>
 </div>
</div>
</div>
<script type="module" src="vfx-lab.js"></script>
</body></html>
