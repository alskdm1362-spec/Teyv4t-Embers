<!doctype html><meta charset="utf-8"><title>VFX drawing review</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#dbe6ed;font:13px sans-serif}header{padding:16px 24px;display:flex;gap:20px;align-items:center}h1{font-size:20px;margin:0}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:0 20px 20px}article{position:relative;height:158px;background:linear-gradient(#1d2b38,#15202c);border:1px solid #68839955;overflow:hidden}article>b{position:absolute;left:10px;top:8px;font-size:11px;color:#bdc9d3;z-index:1}article>img{position:absolute;width:120px;height:120px;left:calc(50% - 60px);bottom:4px;object-fit:contain;image-rendering:pixelated;opacity:.8}canvas.frame{position:absolute;width:100%;height:100%;image-rendering:pixelated}button{position:absolute;right:4px;bottom:4px;background:#183d50;border:1px solid #92cdd566;color:#cbedee;padding:4px 8px;z-index:3;font-size:10px}input{width:180px}output{min-width:40px}</style><header><h1>직접 그린 VFX · 프레임 검토</h1><label>프레임 <input aria-label="프레임" id="progress" type="range" min="0" max="1" step=".01" value=".4"></label><output>.40</output><span>원본 효과와 동일한 그리기 함수</span></header><div id="grid"></div><script type="module">
import {BespokeVFX,drawEffectFrame} from './vfx.js';
const kinds=['spear','frost-finisher','arcane-wave','guard','guard-hit','counter','feint','rally','focus','wind-cleave','veil','night-thrust','venom-mark','abyss-hit','celestial-hit','abyss-charge','celestial-charge','collapse','recover','dissolve','flame-heal'];
const runtime=new BespokeVFX();document.querySelector('#grid').innerHTML=kinds.map(kind=>`<article data-kind="${kind}"><b>${kind}</b><img src="assets/${['spear','frost-finisher','arcane-wave','wind-cleave','night-thrust','venom-mark'].includes(kind)?'enemies/abyss-tick.webp':'actors/lohen-1.png'}"><canvas class="frame"></canvas><button>재생</button></article>`).join('');
function paint(){const t=+document.querySelector('#progress').value;document.querySelector('output').textContent=t.toFixed(2);document.querySelectorAll('article').forEach(el=>{const canvas=el.querySelector('canvas'),w=el.clientWidth,h=el.clientHeight;canvas.width=Math.round(w/2);canvas.height=Math.round(h/2);const c=canvas.getContext('2d');c.translate(canvas.width/2,canvas.height*.58);c.scale(.62,.62);drawEffectFrame(c,el.dataset.kind,t,{seed:42});});}
document.querySelector('#progress').oninput=paint;window.onresize=paint;document.querySelectorAll('article button').forEach(b=>b.onclick=async()=>{const el=b.closest('article'),canvas=el.querySelector('canvas');canvas.style.visibility='hidden';await runtime.play(el.dataset.kind,el.querySelector('img'));canvas.style.visibility='';});paint();
</script>
